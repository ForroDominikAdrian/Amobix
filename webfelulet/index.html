<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amobix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="custom-navbar">
        <span class="nav-brand">Amobix</span>      
        <a href="/multi/index.html" class="nav-link">Polibix</a>
    </nav>

    <div class="gameContainer">
        <div class="container">
            <div class="box btl-0 bl-0"><span class="boxtext"></span></div>
            <div class="box btl-0"><span class="boxtext"></span></div>
            <div class="box btl-0 br-0"><span class="boxtext"></span></div>
            <div class="box bl-0"><span class="boxtext"></span></div>
            <div class="box"><span class="boxtext"></span></div>
            <div class="box br-0"><span class="boxtext"></span></div>
            <div class="box bl-0 bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0"><span class="boxtext"></span></div>
            <div class="box bb-0 br-0"><span class="boxtext"></span></div>
        </div>
        
        <div class="gameInfo">
            <h1>Amobix</h1>
            <div>
                <span class="info">Következik az X</span>
                <button id="reset">Visszaállítás</button>    
            </div>
            
            <div class="imgbox">
                <img src="giphy.gif" alt="">
            </div>
        </div> </div>
    
    <script src="script.js"></script>
